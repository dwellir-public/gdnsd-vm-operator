[tox]
requires = tox-uv>=1.29
no_package = true
env_list = lint, unit
min_version = 4

[testenv]
runner = uv-venv-lock-runner
set_env = PYTHONPATH={tox_root}/src

[testenv:format]
dependency_groups = lint
commands =
    ruff format src tests scripts
    ruff check --fix src tests scripts

[testenv:lint]
dependency_groups = lint
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts

[testenv:unit]
dependency_groups = unit
commands =
    coverage run -m pytest tests/unit {posargs}
    coverage report

[testenv:integration]
dependency_groups = integration
pass_env =
    CHARM_PATH
    TEST_MODEL
    TEST_APPLICATION
    TEST_BASE
    TEST_MACHINE
    JUJU_DATA
    GDNSD_*
commands = pytest -v tests/integration {posargs}
